<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Chino">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#f2f2f7">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#000000">
<title>Chino</title>
<link rel="stylesheet" href="estilos.css">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="iconos/icono-180.png">
<link rel="icon" href="iconos/icono-192.png">
</head>
<body>

<main id="vista" aria-live="polite"></main>

<nav id="pestanas" hidden>
  <button data-ir="hoy" aria-current="true"><span>●</span>Hoy</button>
  <button data-ir="escenas"><span>◉</span>Escenas</button>
  <button data-ir="palabras"><span>≡</span>Palabras</button>
  <button data-ir="progreso"><span>▣</span>Progreso</button>
  <button data-ir="ajustes"><span>⚙</span>Ajustes</button>
</nav>

<script type="module">
  import { arrancar } from "./js/pantallas.js";
  arrancar();

  // Guarda la app para que funcione sin internet.
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(() => {}));
  }
</script>
</body>
</html>
